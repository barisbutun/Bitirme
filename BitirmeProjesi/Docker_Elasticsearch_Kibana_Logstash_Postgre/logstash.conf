input {
  jdbc {
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/BitirmeProjesi"
    jdbc_user => "barishafize"
    jdbc_password => "bitrmeProjesi"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_driver_library => "/usr/share/logstash/lib/postgresql-42.7.2.jar"
    statement => "
       SELECT
           p.*,
           CAST(json_object_agg(pq.quantity_key, pq.stock) AS TEXT) AS quantity
       FROM
           products p
       LEFT JOIN
           product_quantities pq ON p.id = pq.product_id
       GROUP BY
           p.id

    "

    jdbc_validate_connection => true
    schedule => "* * * * *"
    clean_run => true
  }
}
filter {
  json {
    source => "quantity"
    target => "quantity"
  }
}


output {
  elasticsearch {
    index => "products"
    hosts => "https://es01:9200"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl => true
    cacert => "/usr/share/logstash/certs/ca/ca.crt"
    document_id => "%{id}"
  }
}