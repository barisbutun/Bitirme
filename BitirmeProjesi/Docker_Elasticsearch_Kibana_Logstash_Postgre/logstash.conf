input {
  jdbc {
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/BitirmeProjesi"
    jdbc_user => "barishafize"
    jdbc_password => "bitrmeProjesi"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_driver_library => "/usr/share/logstash/lib/postgresql-42.7.2.jar"
    statement => "
      SELECT *
      FROM products
      WHERE updated_ad > COALESCE(
          (SELECT MAX(updated_ad)
           FROM products
           WHERE updated_ad < to_timestamp('1970-01-01 00:00:00', 'YYYY-MM-DD HH24:MI:SS')),
          '1970-01-01 00:00:00'::timestamp
      )"
    parameters => { "sql_last_value" => ":sql_last_value" }
    tracking_column => "updated_ad"
    tracking_column_type => "timestamp"
    clean_run => true
    schedule => "* * * * *"
    jdbc_validate_connection => true
    use_column_value => true
    last_run_metadata_path => "/usr/share/logstash/data/.jdbc_last_run"
  }
}

output {
  elasticsearch {
    index => "products"
    hosts => "https://es01:9200"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl => true
    doc_as_upsert => true
    cacert => "/usr/share/logstash/certs/ca/ca.crt"
    document_id => "%{id}"
  }
}
